<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Display</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      background: rgba(0, 0, 0, 0.3);
      padding: 30px;
      text-align: center;
      border-bottom: 3px solid rgba(255, 255, 255, 0.2);
    }

    .header h1 {
      font-size: 48px;
      font-weight: 800;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
    }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 40px;
      overflow: hidden;
    }

    .items-container {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 30px;
    }

    .item-row {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      padding: 20px 30px;
      margin-bottom: 15px;
      border-radius: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 2px solid rgba(255, 255, 255, 0.2);
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .item-info {
      flex: 1;
    }

    .item-name {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .item-details {
      font-size: 24px;
      opacity: 0.9;
    }

    .item-price {
      font-size: 36px;
      font-weight: 800;
      text-align: right;
    }

    .total-section {
      background: rgba(0, 0, 0, 0.4);
      padding: 30px 40px;
      border-radius: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .total-label {
      font-size: 28px;
      font-weight: 600;
    }

    .total-value {
      font-size: 32px;
      font-weight: 700;
    }

    .grand-total {
      border-top: 3px solid rgba(255, 255, 255, 0.3);
      padding-top: 20px;
      margin-top: 10px;
    }

    .grand-total .total-label {
      font-size: 36px;
      font-weight: 800;
    }

    .grand-total .total-value {
      font-size: 48px;
      font-weight: 900;
      color: #ffd700;
      text-shadow: 0 2px 10px rgba(255, 215, 0, 0.5);
    }

    .empty-state {
      text-align: center;
      padding: 60px;
      opacity: 0.7;
    }

    .empty-state .icon {
      font-size: 120px;
      margin-bottom: 20px;
    }

    .empty-state p {
      font-size: 36px;
      font-weight: 600;
    }

    /* Scrollbar styles */
    .items-container::-webkit-scrollbar {
      width: 10px;
    }

    .items-container::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }

    .items-container::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.3);
      border-radius: 10px;
    }

    .items-container::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.5);
    }
  </style>
</head>
<body>
  <div class="header">
    <h1 id="storeName">SUPERMARKET POS</h1>
  </div>

  <div class="content">
    <div class="items-container" id="itemsContainer">
      <div class="empty-state">
        <div class="icon">🛒</div>
        <p>Scanning items...</p>
      </div>
    </div>

    <div class="total-section">
      <div class="total-row">
        <span class="total-label">Subtotal:</span>
        <span class="total-value" id="subtotalValue">€0.00</span>
      </div>
      <div class="total-row">
        <span class="total-label">Tax:</span>
        <span class="total-value" id="taxValue">€0.00</span>
      </div>
      <div class="total-row grand-total">
        <span class="total-label">TOTAL:</span>
        <span class="total-value" id="totalValue">€0.00</span>
      </div>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    // Update display when cart changes
    ipcRenderer.on('update-display', (event, data) => {
      updateDisplay(data);
    });

    function updateDisplay(data) {
      const itemsContainer = document.getElementById('itemsContainer');
      const currencySymbol = data.currencySymbol || '€';

      if (!data.items || data.items.length === 0) {
        itemsContainer.innerHTML = `
          <div class="empty-state">
            <div class="icon">🛒</div>
            <p>Scanning items...</p>
          </div>
        `;
      } else {
        itemsContainer.innerHTML = data.items.map(item => `
          <div class="item-row">
            <div class="item-info">
              <div class="item-name">${item.productName}</div>
              <div class="item-details">${item.quantity} × ${currencySymbol}${item.unitPrice.toFixed(2)}</div>
            </div>
            <div class="item-price">${currencySymbol}${item.subtotal.toFixed(2)}</div>
          </div>
        `).join('');
      }

      document.getElementById('subtotalValue').textContent = `${currencySymbol}${data.subtotal.toFixed(2)}`;
      document.getElementById('taxValue').textContent = `${currencySymbol}${data.tax.toFixed(2)}`;
      document.getElementById('totalValue').textContent = `${currencySymbol}${data.total.toFixed(2)}`;
    }

    // Update store name
    ipcRenderer.on('update-store-name', (event, storeName) => {
      document.getElementById('storeName').textContent = storeName;
    });
  </script>
</body>
</html>
