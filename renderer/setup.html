<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>First Time Setup - BDCONNECT POS</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .setup-container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 500px;
      width: 100%;
      padding: 50px;
      animation: slideIn 0.5s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .setup-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .setup-icon {
      font-size: 64px;
      margin-bottom: 20px;
    }

    .setup-title {
      font-size: 32px;
      font-weight: 800;
      color: #2d3748;
      margin-bottom: 10px;
    }

    .setup-subtitle {
      font-size: 16px;
      color: #718096;
    }

    .form-group {
      margin-bottom: 25px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #4a5568;
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 16px;
      transition: all 0.3s;
      font-family: inherit;
    }

    .form-input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .password-requirements {
      margin-top: 10px;
      padding: 12px;
      background: #f7fafc;
      border-radius: 8px;
      font-size: 13px;
      color: #718096;
    }

    .requirement {
      display: flex;
      align-items: center;
      margin-bottom: 5px;
    }

    .requirement::before {
      content: '•';
      margin-right: 8px;
      color: #cbd5e0;
    }

    .requirement.valid::before {
      content: '✓';
      color: #48bb78;
    }

    .setup-button {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 30px;
    }

    .setup-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
    }

    .setup-button:active {
      transform: translateY(0);
    }

    .setup-button:disabled {
      background: #cbd5e0;
      cursor: not-allowed;
      transform: none;
    }

    .error-message {
      background: #fed7d7;
      color: #c53030;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }

    .success-message {
      background: #c6f6d5;
      color: #276749;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      text-align: center;
      display: none;
    }

    /* Virtual Keyboard Styles */
    .virtual-keyboard {
      position: fixed;
      bottom: -100%;
      left: 50%;
      transform: translateX(-50%);
      width: 55%;
      max-width: 550px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 12px 12px 0 0;
      box-shadow: 0 -10px 50px rgba(0,0,0,0.4);
      z-index: 10002;
      transition: bottom 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      padding: 10px;
    }

    .virtual-keyboard.active {
      bottom: 0;
    }

    .keyboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      color: white;
    }

    .keyboard-title {
      font-size: 12px;
      font-weight: 600;
    }

    .keyboard-close {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      font-size: 18px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .keyboard-close:hover {
      background: rgba(255,255,255,0.3);
      transform: scale(1.1);
    }

    .keyboard-buttons {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .keyboard-row {
      display: flex;
      justify-content: center;
      gap: 5px;
    }

    .key-btn {
      min-width: 38px;
      height: 38px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      color: #2d3748;
      cursor: pointer;
      transition: all 0.15s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      background: linear-gradient(135deg, #ffffff 0%, #f7fafc 100%);
    }

    .key-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.25);
    }

    .key-btn:active {
      transform: translateY(0);
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .key-number {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      color: white;
      font-size: 15px;
    }

    .key-special {
      background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
      color: #2d3748;
    }

    .key-backspace {
      min-width: 55px;
      background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
      color: white;
      font-size: 16px;
    }

    .key-space {
      min-width: 170px;
      background: linear-gradient(135deg, #a8e6cf 0%, #3ab795 100%);
      color: white;
      font-size: 14px;
    }

    .key-done {
      min-width: 85px;
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      color: white;
      font-size: 14px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="setup-container">
    <div class="setup-header">
      <div class="setup-icon">🏪</div>
      <h1 class="setup-title">Welcome!</h1>
      <p class="setup-subtitle">Let's set up your admin account</p>
    </div>

    <div id="errorMessage" class="error-message"></div>
    <div id="successMessage" class="success-message">Setup complete! Redirecting to login...</div>

    <form id="setupForm">
      <div class="form-group">
        <label class="form-label" for="fullName">Your Full Name</label>
        <input type="text" id="fullName" class="form-input" required placeholder="e.g., John Smith">
      </div>

      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input type="text" id="username" class="form-input" required placeholder="Choose a username" minlength="3">
      </div>

      <button type="submit" class="setup-button" id="setupButton">Complete Setup</button>
    </form>
  </div>

  <script src="setup.js"></script>
</body>
</html>
